[project]
name = "fastapi-beanie-finance"
version = "0.1.0"
description = "Aplicação Financeira de Controle de Gastos"
readme = "README.md"

requires-python = ">=3.10"
dependencies = [
    "beanie>=2.0.1",
    "dnspython>=2.8.0",
    "fastapi[standard]>=0.115.0",
    "motor>=3.6.0",
    "pydantic-settings>=2.6.0",
    "pydantic[email]>=2.9.0",
    "pymongo>=4.9.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []